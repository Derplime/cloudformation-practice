AWSTemplateFormatVersion: '2010-09-09'
Description: >
  File: 01_BareBonesVPC.yaml
  Purpose: CloudFormation template generates a single VPC with no other resources.
  What to observe:
    - The Events tab shows a single resource being created
    - The Outputs tab shows the VPC ID after creation
    - Go to the VPC Console and confirm the VPC appears

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

Resources:
  PracticeVPC:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: Initial bare bones vpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: practice-vpc

Outputs:
  VpcId:
    Description: The VPC ID
    Value: !Ref PracticeVPC
    